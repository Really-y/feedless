<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="DM Only — messages only on social media">
  <style>
    .bg { fill: #fbfbfa; }
    .ink { fill: #191918; }
    .muted { fill: #787774; }
    .line { stroke: #eaeaea; }
    .card { fill: #ffffff; stroke: #eaeaea; }
    .bubble-in { fill: #efeeeb; }
    .bubble-out { fill: #191918; }
    .bubble-out-text { fill: #ffffff; }
    .pill-bg { fill: #edf3ec; }
    .pill-ink { fill: #346538; }
    .blocked { fill: #fbfbfa; stroke: #d6d5d2; }
    .serif { font-family: "New York", "Iowan Old Style", Charter, Georgia, serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #191919; }
      .ink { fill: #ededec; }
      .muted { fill: #9b9a97; }
      .line { stroke: #2c2c2b; }
      .card { fill: #202020; stroke: #2c2c2b; }
      .bubble-in { fill: #2c2c2b; }
      .bubble-out { fill: #ededec; }
      .bubble-out-text { fill: #111111; }
      .pill-bg { fill: #233024; }
      .pill-ink { fill: #8cc492; }
      .blocked { fill: #191919; stroke: #3a3a39; }
    }
  </style>

  <rect class="bg" width="1280" height="420"/>

  <!-- Faint grid lines -->
  <g class="line" stroke-width="1">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="1200" y1="0" x2="1200" y2="420"/>
  </g>

  <!-- Left: wordmark -->
  <text x="120" y="112" class="mono muted" font-size="15" letter-spacing="2.2">AZEDEV · OPEN SOURCE</text>
  <text x="114" y="222" class="serif ink" font-size="112" letter-spacing="-4">DM Only</text>
  <text x="120" y="276" class="sans muted" font-size="24" letter-spacing="-0.2">Messages only on social media.</text>
  <text x="120" y="308" class="sans muted" font-size="24" letter-spacing="-0.2">Reels, For You and the feed stay closed.</text>

  <!-- Right: chat card -->
  <g transform="translate(760 92)">
    <rect class="card" width="360" height="236" rx="16" stroke-width="1"/>
    <!-- header -->
    <circle cx="28" cy="30" r="5" class="muted" opacity="0.35"/>
    <circle cx="46" cy="30" r="5" class="muted" opacity="0.35"/>
    <circle cx="64" cy="30" r="5" class="muted" opacity="0.35"/>
    <rect x="238" y="18" width="104" height="24" rx="12" class="pill-bg"/>
    <circle cx="254" cy="30" r="3.5" class="pill-ink"/>
    <text x="264" y="34.5" class="sans pill-ink" font-size="11" font-weight="600" letter-spacing="0.8">DMS ONLY</text>

    <!-- incoming bubble -->
    <rect x="20" y="62" width="196" height="38" rx="12" class="bubble-in"/>
    <text x="36" y="86" class="sans ink" font-size="15">Still on for tonight?</text>

    <!-- blocked shared reel -->
    <rect x="20" y="110" width="232" height="48" rx="12" class="blocked" stroke-width="1"/>
    <g transform="translate(34 122)" fill="none" stroke="#9b9a97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3l18 18"/>
      <path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 4.5 10 6-.4.7-1.4 2-2.8 3.2M6.6 6.6C4.4 8 2.8 10.2 2 12c1 1.5 5 6 10 6 1.6 0 3-.4 4.3-1"/>
    </g>
    <text x="68" y="129" class="mono muted" font-size="9.5" letter-spacing="1">DM ONLY</text>
    <text x="68" y="147" class="sans ink" font-size="13.5">Shared video hidden</text>

    <!-- outgoing bubble -->
    <rect x="196" y="172" width="144" height="38" rx="12" class="bubble-out"/>
    <text x="212" y="196" class="sans bubble-out-text" font-size="15">Yes, see you at 7</text>
  </g>
</svg>
