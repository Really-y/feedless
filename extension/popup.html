<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <title>DM Only</title>
  <style>
    :root {
      --canvas: #fbfbfa;
      --surface: #ffffff;
      --ink: #191918;
      --ink-2: #2f3437;
      --muted: #787774;
      --line: #eaeaea;
      --track: #efeeeb;
      --btn: #111111;
      --btn-ink: #ffffff;
      --btn-hover: #333333;
      --green-bg: #edf3ec; --green: #346538;
      --yellow-bg: #fbf3db; --yellow: #956400;
      --red-bg: #fdebec; --red: #9f2f2d;
      --serif: "New York", "Iowan Old Style", "Charter", "Newsreader", ui-serif, Georgia, serif;
      --sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Geist", "Helvetica Neue", system-ui, sans-serif;
      --mono: "SF Mono", "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #191919;
        --surface: #202020;
        --ink: #ededec;
        --ink-2: #d4d4d2;
        --muted: #9b9a97;
        --line: rgba(255, 255, 255, 0.08);
        --track: rgba(255, 255, 255, 0.08);
        --btn: #ededec;
        --btn-ink: #111111;
        --btn-hover: #ffffff;
        --green-bg: rgba(84, 156, 92, 0.16); --green: #8cc492;
        --yellow-bg: rgba(214, 160, 40, 0.16); --yellow: #e2b75a;
        --red-bg: rgba(220, 80, 75, 0.16); --red: #f08f8a;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 320px;
      background: var(--canvas);
      color: var(--ink-2);
      font: 13px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    main { padding: 20px 20px 16px; }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
    .brand svg { width: 18px; height: 18px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
      transition: background-color 240ms var(--ease), color 240ms var(--ease);
    }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.dm { background: var(--green-bg); color: var(--green); }
    .pill.full { background: var(--yellow-bg); color: var(--yellow); }
    .pill.out { background: var(--red-bg); color: var(--red); }

    /* Hero time */
    .hero { margin: 26px 0 18px; }
    .time {
      font-family: var(--serif);
      font-size: 52px; line-height: 1; letter-spacing: -0.035em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .time small { font-size: 22px; letter-spacing: -0.01em; color: var(--muted); margin-left: 4px; }
    .meta {
      margin-top: 8px;
      font: 10px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted);
    }
    .bar { height: 3px; margin-top: 16px; border-radius: 2px; background: var(--track); overflow: hidden; }
    .bar > span {
      display: block; height: 100%; width: 100%;
      background: var(--ink);
      transform-origin: left center;
      transition: transform 600ms var(--ease);
    }

    /* Primary action */
    .cta {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 11px 14px;
      border: 0; border-radius: 6px;
      background: var(--btn); color: var(--btn-ink);
      font: 600 13px/1 var(--sans); letter-spacing: -0.005em;
      cursor: pointer;
      transition: background-color 160ms ease, transform 100ms ease-out;
    }
    .cta svg { width: 14px; height: 14px; }
    .cta:hover { background: var(--btn-hover); }
    .cta:active { transform: scale(0.97); }
    .cta.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .cta.ghost:hover { background: var(--surface); }
    .cta:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .cta:focus-visible, .step:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* Sections */
    section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .label {
      margin-bottom: 10px;
      font: 10px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted);
    }
    .sites { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .site {
      padding: 12px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--surface);
    }
    .site b { display: block; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
    .site span { font-size: 11px; color: var(--muted); }

    .limit { display: flex; align-items: center; justify-content: space-between; }
    .limit-name { color: var(--ink); font-weight: 500; }
    .stepper {
      display: inline-flex; align-items: center;
      border: 1px solid var(--line); border-radius: 6px;
      background: var(--surface);
    }
    .step {
      width: 30px; height: 28px;
      border: 0; background: transparent; color: var(--ink);
      font: 500 16px/1 var(--sans);
      cursor: pointer;
      transition: background-color 120ms ease, transform 100ms ease-out;
    }
    .step:hover { background: var(--track); }
    .step:active { transform: scale(0.92); }
    .step:disabled { opacity: 0.3; cursor: not-allowed; }
    .value {
      min-width: 64px; text-align: center;
      font: 500 12px/28px var(--mono); color: var(--ink);
      border-inline: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    .note { margin-top: 8px; font-size: 11px; color: var(--muted); min-height: 16px; }
    .note.pending { color: var(--yellow); }

    footer {
      display: flex; justify-content: space-between;
      margin-top: 18px;
      font: 10px/1 var(--mono); letter-spacing: 0.04em; color: var(--muted);
    }
    footer a { color: inherit; text-decoration: none; transition: color 160ms ease; }
    footer a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }

    /* Entry */
    .rise { opacity: 0; transform: translateY(6px); animation: rise 520ms var(--ease) forwards; animation-delay: calc(var(--i, 0) * 60ms); }
    @keyframes rise { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .rise { animation: fade 160ms ease forwards; transform: none; }
      @keyframes fade { to { opacity: 1; } }
      .bar > span, .pill { transition: none; }
    }
    @media (prefers-contrast: more) {
      :root { --line: currentColor; --muted: var(--ink-2); }
    }
  </style>
</head>
<body>
  <main>
    <header class="rise" style="--i:0">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12Z"/>
        </svg>
        DM Only
      </div>
      <span class="pill dm" id="pill">Yalnız mesajlar</span>
    </header>

    <div class="hero rise" style="--i:1">
      <div class="time" id="time" aria-live="polite">2:00</div>
      <div class="meta" id="meta">Bugün tam rejim üçün qalan vaxt</div>
      <div class="bar" aria-hidden="true"><span id="progress"></span></div>
    </div>

    <button class="cta rise" style="--i:2" id="toggle" disabled>…</button>

    <section class="rise" style="--i:3">
      <div class="label">Qorunan saytlar</div>
      <div class="sites">
        <div class="site"><b>Instagram</b><span id="s-ig">Yalnız DM</span></div>
        <div class="site"><b>TikTok</b><span id="s-tt">Yalnız mesajlar</span></div>
      </div>
    </section>

    <section class="rise" style="--i:4">
      <div class="limit">
        <span class="limit-name">Gündəlik limit</span>
        <div class="stepper" role="group" aria-label="Gündəlik limit">
          <button class="step" id="minus" aria-label="15 dəqiqə azalt">−</button>
          <span class="value" id="limit">120 dəq</span>
          <button class="step" id="plus" aria-label="15 dəqiqə artır">+</button>
        </div>
      </div>
      <div class="note" id="note">Azaltmaq dərhal, artırmaq sabahdan işləyir.</div>
    </section>

    <footer class="rise" style="--i:5">
      <a href="https://www.azedev.com" target="_blank" rel="noopener">Azedev</a>
      <span id="version"></span>
    </footer>
  </main>

  <script src="quota.js"></script>
  <script src="popup.js"></script>
</body>
</html>
